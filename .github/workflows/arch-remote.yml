name: Ubuntu Headless Development Runner + Tailscale + SSH

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ubuntu-remote-session
  cancel-in-progress: false

jobs:
  secure-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Previous Workspace Snapshot
        id: previous
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "arch-remote.yml",
              branch: process.env.TARGET_BRANCH,
              status: "completed",
              sort: "created",
              direction: "desc",
              per_page: 100
            });

            // Only inspect the immediately previous completed runner session.
            // Do not silently fall back to an older artifact if this run did
            // not produce one; that is how stale workspaces get resurrected.
            const latestRun = runsResponse.data.workflow_runs.find(
              run => String(run.id) !== String(context.runId)
            );

            if (!latestRun) {
              core.setOutput("run_id", "");
              core.setOutput("artifact_id", "");
              core.notice("No previous completed arch-remote.yml run exists on this branch.");
              return;
            }

            const attempt = Number(latestRun.run_attempt || 1);
            const expectedName =
              "linux-remote-workspace-" + latestRun.id + "-" + attempt;

            const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: latestRun.id,
              per_page: 100
            });

            const usable = artifactsResponse.data.artifacts.filter(
              item => item.expired !== true
            );

            // New artifacts are unique to run ID + attempt. Accept the old
            // fixed name only for legacy first-attempt runs created before
            // unique naming was introduced.
            let artifact = usable
              .filter(item => item.name === expectedName)
              .sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at)
              )[0];

            if (!artifact && attempt === 1) {
              artifact = usable
                .filter(item => item.name === "linux-remote-workspace")
                .sort((a, b) =>
                  Date.parse(b.created_at) - Date.parse(a.created_at)
                )[0];
            }

            if (!artifact) {
              core.setOutput("run_id", "");
              core.setOutput("artifact_id", "");
              core.warning(
                "The immediately previous completed runner session #" +
                latestRun.run_number + " (run ID " + latestRun.id +
                ", attempt " + attempt + ") has no unexpired workspace artifact. " +
                "Older artifacts will NOT be restored."
              );
              return;
            }

            core.setOutput("run_id", String(latestRun.id));
            core.setOutput("artifact_id", String(artifact.id));
            core.setOutput("artifact_name", artifact.name);
            core.setOutput("artifact_created_at", artifact.created_at);
            core.setOutput("run_number", String(latestRun.run_number));
            core.setOutput("run_attempt", String(attempt));
            core.setOutput("head_sha", latestRun.head_sha || "");
            core.setOutput("head_branch", latestRun.head_branch || "");

            core.notice(
              "Selected exact previous-session artifact " + artifact.name +
              " (artifact ID " + artifact.id + ") from run #" +
              latestRun.run_number + ", attempt " + attempt +
              ", created at " + artifact.created_at +
              ", commit " + (latestRun.head_sha || "unknown")
            );

      - name: Prepare Persistent Directories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remote-workspace"
          mkdir -p "$RUNNER_TEMP/remote-opencode-data"
          mkdir -p "$RUNNER_TEMP/remote-claude-data"
          mkdir -p "$RUNNER_TEMP/remote-herdr-config"
          mkdir -p "$RUNNER_TEMP/remote-cargo-home"
          mkdir -p "$RUNNER_TEMP/remote-rustup-home"

      - name: Download Exact Previous Workspace Artifact
        if: steps.previous.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/workspace-restore

      - name: Restore Previous Workspace
        id: restore
        if: steps.previous.outputs.artifact_id != ''
        env:
          SOURCE_RUN_ID: ${{ steps.previous.outputs.run_id }}
          SOURCE_RUN_NUMBER: ${{ steps.previous.outputs.run_number }}
          SOURCE_ARTIFACT_ID: ${{ steps.previous.outputs.artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ steps.previous.outputs.artifact_name }}
          SOURCE_ARTIFACT_CREATED_AT: ${{ steps.previous.outputs.artifact_created_at }}
          SOURCE_RUN_ATTEMPT: ${{ steps.previous.outputs.run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.previous.outputs.head_sha }}
        run: |
          set -euo pipefail

          echo "Restoring exact artifact: $SOURCE_ARTIFACT_NAME"
          echo "Artifact ID: $SOURCE_ARTIFACT_ID"
          echo "Source workflow run: #$SOURCE_RUN_NUMBER (ID $SOURCE_RUN_ID, attempt $SOURCE_RUN_ATTEMPT)"
          echo "Artifact created at: $SOURCE_ARTIFACT_CREATED_AT"
          echo "Source commit: $SOURCE_HEAD_SHA"

          RESTORE_DIR="$RUNNER_TEMP/workspace-restore"
          test -s "$RESTORE_DIR/workspace.tar.gz" || {
            echo "::error::Selected snapshot artifact is missing workspace.tar.gz."
            exit 1
          }
          test -s "$RESTORE_DIR/opencode-data.tar.gz" || {
            echo "::error::Selected snapshot artifact is missing opencode-data.tar.gz."
            exit 1
          }

          # Verify every supplied archive before extracting anything. This
          # prevents a partial restore from mixing old and new state.
          for archive in "$RESTORE_DIR"/*.tar.gz; do
            [ -e "$archive" ] || continue
            tar -tzf "$archive" >/dev/null || {
              echo "::error::Snapshot archive is corrupt: $archive"
              exit 1
            }
          done

          if [ -f "$RESTORE_DIR/snapshot-manifest.json" ]; then
            python3 - "$RESTORE_DIR/snapshot-manifest.json" "$SOURCE_RUN_ID" "$SOURCE_ARTIFACT_NAME" <<'PY'
          import json
          import sys

          manifest_path, expected_run_id, expected_artifact_name = sys.argv[1:4]
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)

          actual_run_id = str(manifest.get("run_id", ""))
          actual_artifact_name = str(manifest.get("artifact_name", ""))

          if actual_run_id != expected_run_id:
              raise SystemExit(
                  f"Snapshot manifest run ID {actual_run_id!r} does not match "
                  f"selected run ID {expected_run_id!r}"
              )

          if actual_artifact_name != expected_artifact_name:
              raise SystemExit(
                  f"Snapshot manifest artifact name {actual_artifact_name!r} "
                  f"does not match selected artifact {expected_artifact_name!r}"
              )

          print(
              "Snapshot manifest verified:",
              f"run #{manifest.get('run_number', 'unknown')},",
              f"commit {manifest.get('sha', 'unknown')},",
              f"created {manifest.get('created_at', 'unknown')}",
          )
          PY
          else
            echo "Legacy snapshot detected (created before snapshot manifests were added)."
          fi

          if [ -f "$RESTORE_DIR/workspace.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/workspace-restore/workspace.tar.gz" \
              -C "$RUNNER_TEMP/remote-workspace"
            echo "Previous workspace restored."
          else
            echo "No workspace archive was present in the downloaded artifact."
          fi

          if [ -f "$RUNNER_TEMP/workspace-restore/opencode-data.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/workspace-restore/opencode-data.tar.gz" \
              -C "$RUNNER_TEMP/remote-opencode-data"
            echo "Previous OpenCode user data restored."
          else
            echo "No previous OpenCode data archive found; starting with an empty OpenCode data directory."
          fi

          for state in claude-data herdr-config cargo-home rustup-home; do
            archive="$RUNNER_TEMP/workspace-restore/$state.tar.gz"
            case "$state" in
              claude-data) target="$RUNNER_TEMP/remote-claude-data" ;;
              herdr-config) target="$RUNNER_TEMP/remote-herdr-config" ;;
              cargo-home) target="$RUNNER_TEMP/remote-cargo-home" ;;
              rustup-home) target="$RUNNER_TEMP/remote-rustup-home" ;;
            esac

            if [ -f "$archive" ]; then
              tar -xzf "$archive" -C "$target"
              echo "Restored $state."
            else
              echo "No previous $state archive found; starting fresh."
            fi
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: "tag:github-actions"
          version: latest

      - name: Verify Tailscale Connection
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"
          test -n "$TS_IP" || { echo "Tailscale did not assign an IPv4 address."; exit 1; }
          echo "Tailscale connection established: $TS_IP"

      - name: Start Headless Ubuntu 24.04 Container
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          docker rm -f linux-remote 2>/dev/null || true

          DOCKER_ARGS=(
            --name linux-remote
            --network host
            --restart=no
            --volume "$RUNNER_TEMP/remote-workspace:/workspace"
            --volume "$RUNNER_TEMP/remote-opencode-data:/home/remote/.local/share/opencode"
            --volume "$RUNNER_TEMP/remote-claude-data:/claude-data"
            --volume "$RUNNER_TEMP/remote-herdr-config:/herdr-config"
            --volume "$RUNNER_TEMP/remote-cargo-home:/cargo-home"
            --volume "$RUNNER_TEMP/remote-rustup-home:/rustup-home"
          )

          # Expose the host Docker daemon when the runner provides its socket.
          if [ -S /var/run/docker.sock ]; then
            DOCKER_ARGS+=(--volume /var/run/docker.sock:/var/run/docker.sock)
            echo "Host Docker socket will be exposed to the container."
          else
            echo "WARNING: Host Docker socket is unavailable; Docker CLI will be installed without a daemon."
          fi

          # Nested virtualization is optional and depends on host support.
          if [ -e /dev/kvm ]; then
            DOCKER_ARGS+=(--device /dev/kvm:/dev/kvm)
            echo "Host /dev/kvm will be exposed to the container."
          else
            echo "WARNING: Host /dev/kvm is unavailable; Android Emulator hardware acceleration will not be available."
          fi

          docker run -d "${DOCKER_ARGS[@]}" ubuntu:24.04 sleep infinity

      - name: Install Headless Development Environment
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PUBLIC_KEY//[[:space:]]/}" ]; then
            echo "Missing repository secret: SSH_PUBLIC_KEY"
            exit 1
          fi

          docker exec -i linux-remote bash -s <<'CONTAINER_SETUP'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          log() { printf '\n[runner-setup] %s\n' "$*"; }

          log "Updating apt indexes and installing system packages..."
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg unzip zip p7zip-full xz-utils zstd file \
            git openssh-server sudo build-essential pkg-config cmake ninja-build \
            clang lldb vim nano tmux htop btop ripgrep fd-find bat tree fzf \
            zsh fish neovim jq procps iproute2 iputils-ping netcat-openbsd \
            python3 python3-pip python3-venv \
            openjdk-21-jdk \
            docker.io docker-compose-v2 \
            qemu-kvm cpu-checker libvirt-daemon-system libvirt-clients bridge-utils

          log "Adding the official signed GitHub CLI apt repository..."
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod 0644 /etc/apt/keyrings/githubcli-archive-keyring.gpg
          printf '%s\\n' "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

          log "Creating remote user and SSH configuration..."
          id remote >/dev/null 2>&1 || useradd --create-home --shell /bin/bash remote
          usermod -aG sudo remote
          printf '%s\n' "remote ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/remote
          chmod 0440 /etc/sudoers.d/remote
          visudo -cf /etc/sudoers.d/remote

          mkdir -p /run/sshd /workspace /home/remote/.ssh \
            /home/remote/Downloads /home/remote/Projects /home/remote/.local/bin \
            /home/remote/.local/share /home/remote/.config \
            /claude-data /herdr-config /cargo-home /rustup-home
          chown -R remote:remote /workspace /home/remote \
            /claude-data /herdr-config /cargo-home /rustup-home

          # Persist Claude settings, Herdr configuration, Cargo-installed tools,
          # and Rust toolchains outside the ephemeral container filesystem.
          ln -sfn /claude-data /home/remote/.claude
          ln -sfn /herdr-config /home/remote/.config/herdr
          ln -sfn /cargo-home /home/remote/.cargo
          ln -sfn /rustup-home /home/remote/.rustup

          chmod 700 /home/remote/.ssh
          ssh-keygen -A

          # Give the remote user access to the host Docker socket when mounted.
          if [ -S /var/run/docker.sock ]; then
            DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
            DOCKER_GROUP="$(getent group "$DOCKER_GID" | cut -d: -f1 || true)"
            if [ -z "$DOCKER_GROUP" ]; then
              DOCKER_GROUP="hostdocker"
              getent group "$DOCKER_GROUP" >/dev/null 2>&1 || groupadd --gid "$DOCKER_GID" "$DOCKER_GROUP"
            fi
            usermod -aG "$DOCKER_GROUP" remote
            log "Added remote to Docker socket group ($DOCKER_GROUP, GID $DOCKER_GID)."
          fi

          # Match the KVM device group ID instead of assuming a fixed group number.
          if [ -e /dev/kvm ]; then
            KVM_GID="$(stat -c '%g' /dev/kvm)"
            KVM_GROUP="$(getent group "$KVM_GID" | cut -d: -f1 || true)"
            if [ -z "$KVM_GROUP" ]; then
              KVM_GROUP="hostkvm"
              getent group "$KVM_GROUP" >/dev/null 2>&1 || groupadd --gid "$KVM_GID" "$KVM_GROUP"
            fi
            usermod -aG "$KVM_GROUP" remote
            chmod g+rw /dev/kvm || true
            log "Added remote to KVM device group ($KVM_GROUP, GID $KVM_GID)."
          else
            log "WARNING: /dev/kvm is not mounted; KVM acceleration is unavailable."
          fi

          # SSH public key is injected separately through docker exec stdin below.
          # SSH password authentication remains disabled.

          cat > /etc/ssh/sshd_config <<'SSHD_CONFIG'
          Port 2222
          AddressFamily any
          ListenAddress 0.0.0.0
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          AllowUsers remote
          X11Forwarding no
          AllowTcpForwarding yes
          PermitTunnel no
          Subsystem sftp /usr/lib/openssh/sftp-server
          SSHD_CONFIG

          sshd -t
          docker --version
          docker compose version
          java -version
          git --version

          log "Installing Android command-line tools..."
          ANDROID_HOME=/home/remote/Android/Sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            TMP_DIR="$(mktemp -d)"
            TOOL_ARCHIVE="$TMP_DIR/commandlinetools-linux.zip"
            curl -fL --retry 3 --retry-delay 2 \
              "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
              -o "$TOOL_ARCHIVE"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TOOL_ARCHIVE" | sha256sum -c -
            mkdir -p "$TMP_DIR/extracted"
            unzip -q "$TOOL_ARCHIVE" -d "$TMP_DIR/extracted"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -a "$TMP_DIR/extracted/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$TMP_DIR"
          else
            log "Android command-line tools already exist; skipping download."
          fi

          cat > /etc/profile.d/remote-android.sh <<'ANDROID_ENV'
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export ANDROID_HOME=/home/remote/Android/Sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export CARGO_HOME="$HOME/.cargo"
          export RUSTUP_HOME="$HOME/.rustup"
          export PATH="$CARGO_HOME/bin:$HOME/.local/bin:$HOME/.opencode/bin:$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          ANDROID_ENV
          chmod 644 /etc/profile.d/remote-android.sh
          chown -R remote:remote /home/remote/Android

          log "Installing Android SDK API 36 packages and accepting licenses..."
          su - remote -s /bin/bash -c '
            set -e
            source /etc/profile.d/remote-android.sh
            set +o pipefail
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
            set -o pipefail
            sdkmanager --sdk_root="$ANDROID_HOME" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "emulator" \
              "system-images;android-36;google_apis;x86_64"

            if ! avdmanager list avd | grep -Fq "Name: pizzora_api36_qa"; then
              printf "no\n" | avdmanager create avd \
                --name pizzora_api36_qa \
                --package "system-images;android-36;google_apis;x86_64" \
                --device pixel_6
            else
              echo "AVD pizzora_api36_qa already exists; preserving it."
            fi
          '

          log "Installing Claude Code, OpenCode 2 and Herdr for the remote user..."
          su - remote -s /bin/bash -c '
            set -e
            export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
            mkdir -p "$HOME/.claude"

            if ! command -v claude >/dev/null 2>&1; then
              curl -fsSL https://claude.ai/install.sh | bash
            else
              echo "Claude Code already installed; skipping installer."
            fi

            if ! command -v opencode >/dev/null 2>&1; then
              curl -fsSL https://opencode.ai/v2/install | bash
            else
              echo "OpenCode already installed; skipping installer."
            fi

            if ! command -v herdr >/dev/null 2>&1; then
              curl -fsSL https://herdr.dev/install.sh | sh
            else
              echo "Herdr TUI already installed; skipping installer."
            fi

            export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
            if command -v herdr >/dev/null 2>&1 && command -v claude >/dev/null 2>&1; then
              herdr integration install claude
            fi
          '

          # Ubuntu package names differ from their familiar command names.
          if command -v fdfind >/dev/null 2>&1 && [ ! -e /home/remote/.local/bin/fd ]; then
            ln -s "$(command -v fdfind)" /home/remote/.local/bin/fd
          fi
          if command -v batcat >/dev/null 2>&1 && [ ! -e /home/remote/.local/bin/bat ]; then
            ln -s "$(command -v batcat)" /home/remote/.local/bin/bat
          fi
          chown -R remote:remote /home/remote/.local /home/remote/.opencode /home/remote/Android 2>/dev/null || true

          log "Starting SSH daemon..."
          /usr/sbin/sshd -t
          CONTAINER_SETUP

          # Feed the public key through stdin; never echo it into workflow logs.
          printf '%s\n' "$SSH_PUBLIC_KEY" |
            docker exec -i linux-remote bash -c 'cat > /home/remote/.ssh/authorized_keys && chown remote:remote /home/remote/.ssh/authorized_keys && chmod 600 /home/remote/.ssh/authorized_keys'

          docker exec -d linux-remote /usr/sbin/sshd -D -e

      - name: Run Additional Terminal Utilities
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/Download.sh" ]; then
            docker cp "$GITHUB_WORKSPACE/Download.sh" linux-remote:/home/remote/Download.sh
            docker exec linux-remote chown remote:remote /home/remote/Download.sh
            docker exec linux-remote chmod 700 /home/remote/Download.sh
            docker exec linux-remote su - remote -s /bin/bash -c 'bash /home/remote/Download.sh'
          else
            echo "Download.sh not found; core development environment is already installed by this workflow."
          fi

      - name: Verify Development Environment and SSH
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"

          echo "Checking SSH on $TS_IP:2222"
          for attempt in $(seq 1 30); do
            if nc -z -w 3 "$TS_IP" 2222; then
              echo "SSH port 2222 is reachable."
              break
            fi
            echo "Waiting for SSH server ($attempt/30)..."
            sleep 3
          done

          if ! nc -z -w 3 "$TS_IP" 2222; then
            echo "SSH port 2222 is not reachable."
            docker logs linux-remote || true
            exit 1
          fi

          docker exec linux-remote su - remote -s /bin/bash -c '
            source /etc/profile.d/remote-android.sh
            echo "---- Installed tool versions ----"
            java -version
            git --version
            docker --version || true
            docker compose version || true
            claude --version
            gh --version
            opencode --version
            herdr --version
            sdkmanager --version
            adb version
            emulator -version | head -n 2 || true
            echo "---- Android AVD ----"
            avdmanager list avd
            echo "---- Docker daemon ----"
            docker info >/dev/null 2>&1 && echo "Host Docker daemon reachable." || echo "WARNING: Docker daemon unavailable."
            echo "---- KVM ----"
            if [ -e /dev/kvm ]; then
              emulator -accel-check || echo "WARNING: Emulator acceleration check failed."
            else
              echo "WARNING: /dev/kvm unavailable; emulator will not have hardware acceleration."
            fi
          '

      - name: Maintain Remote Linux Session
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"

          echo
          echo "========================================"
          echo "UBUNTU 24.04 HEADLESS DEVELOPMENT RUNNER"
          echo "========================================"
          echo "Tailscale IP: $TS_IP"
          echo "SSH Port:     2222"
          echo "Username:     remote"
          echo "Workspace:    /workspace"
          echo "OpenCode data: /home/remote/.local/share/opencode (persisted)"
          echo "Claude config: /home/remote/.claude (credentials excluded from artifact)"
          echo "Herdr config:  /home/remote/.config/herdr (persisted)"
          echo "Cargo tools:   /home/remote/.cargo/bin (persisted)"
          echo "Rust toolchain:/home/remote/.rustup (persisted)"
          echo "Generated workspace build folders are removed before snapshot."
          echo
          echo "SSH:"
          echo "ssh -p 2222 remote@$TS_IP"
          echo
          echo "Zed Remote Development:"
          echo "zed ssh://remote@$TS_IP:2222/workspace"
          echo
          echo "Configure ~/.ssh/config with Host pizzabi-runner to use:"
          echo "zed ssh://remote@pizzabi-runner:2222/workspace"
          echo "========================================"

          while true; do
            if [ "$(docker inspect -f '{{.State.Running}}' linux-remote 2>/dev/null)" != "true" ]; then
              echo "Remote container stopped unexpectedly."
              docker logs linux-remote || true
              exit 1
            fi
            echo "[$(date -Is)] Headless Ubuntu session is running."
            sleep 300
          done

      - name: Cleanup Generated Workspace and Cargo Build Caches
        if: always()
        run: |
          set -uo pipefail

          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"

          # Clean as container root so files owned by the remote SSH user can
          # be removed even when the GitHub host runner has a different UID.
          if [ "$(docker inspect -f '{{.State.Running}}' linux-remote 2>/dev/null || true)" = "true" ]; then
            docker exec -u 0 \
              -e HOST_UID="$HOST_UID" \
              -e HOST_GID="$HOST_GID" \
              linux-remote bash -s <<'CONTAINER_CLEANUP'
          set -uo pipefail
          WORKSPACE="/workspace"

          if [ -d "$WORKSPACE" ]; then
            echo "Removing generated build and dependency directories..."
            find "$WORKSPACE" -type d \( \
              -name node_modules -o \
              -name target -o \
              -name .next -o \
              -name .turbo -o \
              -name .cache -o \
              -name .parcel-cache -o \
              -name .vite -o \
              -name .svelte-kit -o \
              -name .angular -o \
              -name .gradle -o \
              -name .dart_tool -o \
              -name coverage -o \
              -name dist -o \
              -name build -o \
              -name out -o \
              -name __pycache__ -o \
              -name .pytest_cache -o \
              -name .mypy_cache -o \
              -name .ruff_cache -o \
              -name .venv -o \
              -name venv -o \
              -name CMakeFiles -o \
              -name cmake-build-debug -o \
              -name cmake-build-release \
            \) -prune -print -exec rm -rf -- {} + || true

            find "$WORKSPACE" -type f \( -name '*.pyc' -o -name '*.pyo' \) \
              -print -delete || true
          fi

          # Keep installed Cargo executables and Rust toolchains, but discard
          # the regenerable registry and Git download caches.
          rm -rf /cargo-home/registry /cargo-home/git || true

          # The next step archives files on the GitHub host. Transfer ownership
          # of mounted data to that host runner so even mode-0600 files are readable.
          chown -R "$HOST_UID:$HOST_GID" \
            /workspace /claude-data /herdr-config /cargo-home /rustup-home \
            /home/remote/.local/share/opencode 2>/dev/null || true
          CONTAINER_CLEANUP
          else
            echo "Container is unavailable; attempting host-side cleanup."
            WORKSPACE="$RUNNER_TEMP/remote-workspace"
            sudo find "$WORKSPACE" -type d \( \
              -name node_modules -o -name target -o -name .next -o -name .turbo \
              -o -name .cache -o -name .parcel-cache -o -name .vite \
              -o -name .svelte-kit -o -name .angular -o -name .gradle \
              -o -name .dart_tool -o -name coverage -o -name dist -o -name build \
              -o -name out -o -name __pycache__ -o -name .pytest_cache \
              -o -name .mypy_cache -o -name .ruff_cache -o -name .venv \
              -o -name venv -o -name CMakeFiles -o -name cmake-build-debug \
              -o -name cmake-build-release \
            \) -prune -print -exec rm -rf -- {} + || true
            sudo rm -rf "$RUNNER_TEMP/remote-cargo-home/registry" \
              "$RUNNER_TEMP/remote-cargo-home/git" || true
            sudo chown -R "$HOST_UID:$HOST_GID" \
              "$RUNNER_TEMP/remote-workspace" \
              "$RUNNER_TEMP/remote-opencode-data" \
              "$RUNNER_TEMP/remote-claude-data" \
              "$RUNNER_TEMP/remote-herdr-config" \
              "$RUNNER_TEMP/remote-cargo-home" \
              "$RUNNER_TEMP/remote-rustup-home" || true
          fi

          echo "Cleanup finished. Project sources and installed tools are retained."

      - name: Create Workspace Snapshot
        id: snapshot
        # Do not write a blank/new snapshot when a selected artifact failed to
        # download or restore. Preserve the last good artifact instead.
        if: always() && (steps.previous.outputs.artifact_id == '' || steps.restore.outcome == 'success')
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/remote-workspace" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/workspace.tar.gz" \
            -C "$RUNNER_TEMP/remote-workspace" .

          tar -czf "$RUNNER_TEMP/opencode-data.tar.gz" \
            -C "$RUNNER_TEMP/remote-opencode-data" .

          # Claude settings, plugins, agents and commands persist, but never
          # store the Linux Claude login token in a GitHub Actions artifact.
          tar --exclude='./.credentials.json' \
            --exclude='.credentials.json' \
            --exclude='*/.credentials.json' \
            -czf "$RUNNER_TEMP/claude-data.tar.gz" \
            -C "$RUNNER_TEMP/remote-claude-data" .

          tar -czf "$RUNNER_TEMP/herdr-config.tar.gz" \
            -C "$RUNNER_TEMP/remote-herdr-config" .

          # Preserve Cargo-installed binaries and metadata, excluding registry
          # credentials should a private registry have been configured.
          tar --exclude='./credentials.toml' \
            --exclude='credentials.toml' \
            --exclude='*/credentials.toml' \
            -czf "$RUNNER_TEMP/cargo-home.tar.gz" \
            -C "$RUNNER_TEMP/remote-cargo-home" .

          tar -czf "$RUNNER_TEMP/rustup-home.tar.gz" \
            -C "$RUNNER_TEMP/remote-rustup-home" .

          cat > "$RUNNER_TEMP/snapshot-manifest.json" <<EOF
          {
            "artifact_name": "linux-remote-workspace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT",
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "run_attempt": "$GITHUB_RUN_ATTEMPT",
            "sha": "$GITHUB_SHA",
            "ref": "$GITHUB_REF",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload Workspace Artifact
        if: always() && steps.snapshot.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-remote-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/workspace.tar.gz
            ${{ runner.temp }}/opencode-data.tar.gz
            ${{ runner.temp }}/claude-data.tar.gz
            ${{ runner.temp }}/herdr-config.tar.gz
            ${{ runner.temp }}/cargo-home.tar.gz
            ${{ runner.temp }}/rustup-home.tar.gz
            ${{ runner.temp }}/snapshot-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 3

      - name: Cleanup Ubuntu Container
        if: always()
        run: |
          docker rm -f linux-remote 2>/dev/null || true
          echo "Ubuntu container removed."
