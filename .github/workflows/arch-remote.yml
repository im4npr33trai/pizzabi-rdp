name: Ubuntu Linux + Tailscale + SSH + Download.sh

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ubuntu-remote-session
  cancel-in-progress: false

jobs:
  secure-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Restore the latest successful workspace artifact from this workflow.
      - name: Find Previous Workspace Snapshot
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "arch-remote.yml",
              branch: "Singh",
              status: "completed",
              per_page: 50
            });

            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId || run.conclusion !== "success") {
                continue;
              }

              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });

              const artifact = response.data.artifacts.find(
                item => item.name === "linux-remote-workspace" && !item.expired
              );

              if (artifact) {
                core.setOutput("run_id", String(run.id));
                console.log("Found workspace snapshot from run:", run.id);
                return;
              }
            }

            core.setOutput("run_id", "");
            console.log("No previous workspace snapshot found.");

      - name: Prepare Workspace Directory
        run: |
          mkdir -p "$RUNNER_TEMP/remote-workspace"

      - name: Download Previous Workspace
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: linux-remote-workspace
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/workspace-restore

      - name: Restore Previous Workspace
        if: steps.previous.outputs.run_id != ''
        run: |
          if [ -f "$RUNNER_TEMP/workspace-restore/workspace.tar.gz" ]; then
            tar -xzf "$RUNNER_TEMP/workspace-restore/workspace.tar.gz" \
              -C "$RUNNER_TEMP/remote-workspace"
            echo "Previous workspace restored."
          else
            echo "No workspace archive was present in the downloaded artifact."
          fi

      # Tailscale OIDC federation: these two values are identifiers, not secrets.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: "REPLACE_WITH_TAILSCALE_FEDERATED_CLIENT_ID"
          audience: "REPLACE_WITH_TAILSCALE_FEDERATED_AUDIENCE"
          tags: "tag:github-actions"
          version: latest

      - name: Verify Tailscale Connection
        run: |
          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "Tailscale did not assign an IPv4 address."
            exit 1
          fi

          echo "Tailscale connection established."
          echo "Tailscale IPv4: $TS_IP"

      - name: Start Ubuntu 24.04 Container
        run: |
          docker pull ubuntu:24.04
          docker rm -f linux-remote 2>/dev/null || true

          docker run -d \
            --name linux-remote \
            --network host \
            --restart=no \
            --volume "$RUNNER_TEMP/remote-workspace:/workspace" \
            ubuntu:24.04 \
            sleep infinity

      - name: Install Linux Tools and Configure SSH
        run: |
          set -euo pipefail

          docker exec linux-remote bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y --no-install-recommends \
              openssh-server \
              sudo \
              ca-certificates \
              curl \
              wget \
              git \
              build-essential \
              pkg-config \
              vim \
              nano \
              tmux \
              htop \
              unzip \
              zip \
              jq \
              procps \
              iproute2 \
              iputils-ping \
              netcat-openbsd \
              python3 \
              python3-pip \
              python3-venv \
              bash-completion \
              file \
              xz-utils \
              zstd

            id remote >/dev/null 2>&1 || useradd --create-home --shell /bin/bash remote
            usermod -aG sudo remote
            passwd --lock remote

            printf "%s\\n" "remote ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/remote
            chmod 0440 /etc/sudoers.d/remote
            visudo -cf /etc/sudoers.d/remote

            mkdir -p /run/sshd /workspace /home/remote/.ssh
            chown -R remote:remote /workspace /home/remote/.ssh
            chmod 700 /home/remote/.ssh
            ssh-keygen -A
          '

          # This is a PUBLIC key. Never put your private key in this file.
          SSH_PUBLIC_KEY="ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY"

          if [[ "$SSH_PUBLIC_KEY" == *"REPLACE_WITH_YOUR_PUBLIC_KEY"* ]]; then
            echo "Replace the SSH public-key placeholder in this workflow before running."
            exit 1
          fi

          printf '%s\n' "$SSH_PUBLIC_KEY" |
            docker exec -i linux-remote tee /home/remote/.ssh/authorized_keys >/dev/null

          docker exec linux-remote bash -c '
            chown remote:remote /home/remote/.ssh/authorized_keys
            chmod 600 /home/remote/.ssh/authorized_keys

            cat > /etc/ssh/sshd_config <<EOF
          Port 2222
          AddressFamily any
          ListenAddress 0.0.0.0
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          AllowUsers remote
          X11Forwarding no
          AllowTcpForwarding yes
          PermitTunnel no
          Subsystem sftp /usr/lib/openssh/sftp-server
          EOF

            sshd -t
          '

          docker exec -d linux-remote /usr/sbin/sshd -D -e

      - name: Download and Run Linux Download.sh
        run: |
          set -euo pipefail

          DOWNLOAD_URL="REPLACE_WITH_DIRECT_URL_TO_YOUR_LINUX_Download.sh"

          if [[ "$DOWNLOAD_URL" == *"REPLACE_WITH_DIRECT_URL"* ]]; then
            echo "Replace DOWNLOAD_URL with the direct URL of a Linux shell script."
            exit 1
          fi

          docker exec linux-remote curl --fail --location --show-error \
            "$DOWNLOAD_URL" --output /home/remote/Download.sh

          docker exec linux-remote chown remote:remote /home/remote/Download.sh
          docker exec linux-remote chmod 700 /home/remote/Download.sh

          docker exec linux-remote su - remote -c "bash /home/remote/Download.sh"

      - name: Verify SSH Accessibility
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4 | head -n 1)"

          echo "Checking SSH on $TS_IP:2222"

          for attempt in $(seq 1 20); do
            if nc -z -w 3 "$TS_IP" 2222; then
              echo "SSH port 2222 is reachable."
              exit 0
            fi

            echo "Waiting for SSH server ($attempt/20)..."
            sleep 3
          done

          echo "SSH port 2222 is not reachable."
          docker logs linux-remote || true
          exit 1

      - name: Maintain Remote Linux Session
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4 | head -n 1)"

          echo
          echo "========================================"
          echo "UBUNTU 24.04 REMOTE LINUX"
          echo "========================================"
          echo "Tailscale IP: $TS_IP"
          echo "SSH Port:     2222"
          echo "Username:     remote"
          echo "Workspace:    /workspace"
          echo
          echo "Connect from your own machine with:"
          echo "ssh -p 2222 remote@$TS_IP"
          echo "========================================"
          echo

          while true; do
            if [ "$(docker inspect -f '{{.State.Running}}' linux-remote 2>/dev/null)" != "true" ]; then
              echo "Remote container stopped unexpectedly."
              docker logs linux-remote || true
              exit 1
            fi

            echo "[$(date -Is)] Ubuntu remote session is running."
            sleep 300
          done

      # These always() steps run when the session is cancelled or times out.
      - name: Create Workspace Snapshot
        id: snapshot
        if: always()
        run: |
          set -euo pipefail

          if [ ! -d "$RUNNER_TEMP/remote-workspace" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tar -czf "$RUNNER_TEMP/workspace.tar.gz" \
            -C "$RUNNER_TEMP/remote-workspace" .

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload Workspace Artifact
        if: always() && steps.snapshot.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-remote-workspace
          path: ${{ runner.temp }}/workspace.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Cleanup Ubuntu Container
        if: always()
        run: |
          docker rm -f linux-remote 2>/dev/null || true
          echo "Ubuntu container removed."
