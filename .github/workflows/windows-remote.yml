name: Windows Remote Runner + Tailscale + SSH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-remote-session
  cancel-in-progress: false

jobs:
  windows-remote:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Basic Software
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw 'Chocolatey is not available on this Windows runner image.'
          }

          # Install only tools that are not already available on the runner.
          $tools = @(
            @{ Command = 'git';    Package = 'git' },
            @{ Command = 'node';   Package = 'nodejs-lts' },
            @{ Command = 'python'; Package = 'python' },
            @{ Command = '7z';     Package = '7zip.install' },
            @{ Command = 'rg';     Package = 'ripgrep' },
            @{ Command = 'jq';     Package = 'jq' }
          )

          foreach ($tool in $tools) {
            if (Get-Command $tool.Command -ErrorAction SilentlyContinue) {
              Write-Host "$($tool.Command) is already installed; skipping."
              continue
            }

            Write-Host "Installing $($tool.Package)..."
            & choco install $tool.Package --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install $($tool.Package)."
            }

            # Refresh the process PATH but retain GitHub runner-specific entries.
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath;$env:Path"
          }

          Write-Host ''
          Write-Host 'Installed / available software:'
          git --version
          node --version
          npm --version
          python --version
          7z -h | Select-Object -First 2
          rg --version | Select-Object -First 1
          jq --version

          New-Item -ItemType Directory -Path 'C:\workspace' -Force | Out-Null
          Write-Host 'Workspace directory: C:\workspace'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: "tag:github-actions"
          version: latest

      - name: Configure Windows OpenSSH
        id: ssh
        shell: pwsh
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SSH_PUBLIC_KEY)) {
            throw 'Missing repository secret: SSH_PUBLIC_KEY'
          }

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The GitHub Actions runner process is not elevated; cannot configure OpenSSH.'
          }

          $sshCapability = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if ($sshCapability.State -ne 'Installed') {
            Write-Host 'Installing Windows OpenSSH Server capability...'
            Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Host
          }

          $sshDirectory = Join-Path $env:ProgramData 'ssh'
          $sshdConfig = Join-Path $sshDirectory 'sshd_config'
          $sshdExe = Join-Path $env:WINDIR 'System32\OpenSSH\sshd.exe'
          $sshKeygenExe = Join-Path $env:WINDIR 'System32\OpenSSH\ssh-keygen.exe'
          if (-not (Test-Path $sshdExe)) {
            throw "OpenSSH server executable not found: $sshdExe"
          }

          # Create host keys if this image has not generated them yet.
          & $sshKeygenExe -A
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not generate OpenSSH host keys.'
          }

          $sshUser = $env:USERNAME.ToLowerInvariant()
          $authorizedKeys = Join-Path $sshDirectory 'administrators_authorized_keys'
          $publicKey = $env:SSH_PUBLIC_KEY.Trim()

          if ($publicKey -notmatch '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-[^ ]+)\s+') {
            throw 'SSH_PUBLIC_KEY does not look like a supported OpenSSH public key.'
          }

          # Administrator accounts use the shared ProgramData authorized-keys file.
          [System.IO.File]::WriteAllText(
            $authorizedKeys,
            ($publicKey + [Environment]::NewLine),
            [System.Text.Encoding]::ASCII
          )

          & icacls.exe $authorizedKeys /inheritance:r | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not disable inherited ACLs on the SSH key file.' }

          & icacls.exe $authorizedKeys /grant:r '*S-1-5-32-544:F' '*S-1-5-18:F' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the required SSH key file permissions.' }

          @"
          Port 2222
          AddressFamily any
          ListenAddress 0.0.0.0
          PubkeyAuthentication yes
          PasswordAuthentication no
          AllowUsers $sshUser
          AllowTcpForwarding yes
          Subsystem sftp sftp-server.exe

          Match Group administrators
              AuthorizedKeysFile __PROGRAMDATA__/ssh/administrators_authorized_keys
          "@ | Set-Content -Path $sshdConfig -Encoding ascii

          & $sshdExe -t -f $sshdConfig
          if ($LASTEXITCODE -ne 0) {
            throw 'OpenSSH configuration validation failed.'
          }

          # Use PowerShell as the default SSH shell.
          $openSshRegistry = 'HKLM:\SOFTWARE\OpenSSH'
          New-Item -Path $openSshRegistry -Force | Out-Null
          New-ItemProperty -Path $openSshRegistry -Name DefaultShell -PropertyType String -Value (Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe') -Force | Out-Null

          # Only allow SSH from Tailscale IPv4 addresses.
          $firewallRule = 'Tailscale-OpenSSH-TCP-2222'
          Get-NetFirewallRule -Name $firewallRule -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          $firewallParameters = @{
            Name         = $firewallRule
            DisplayName  = 'OpenSSH over Tailscale (TCP 2222)'
            Direction    = 'Inbound'
            Action       = 'Allow'
            Protocol     = 'TCP'
            LocalPort    = 2222
            RemoteAddress = '100.64.0.0/10'
            Profile      = 'Any'
          }
          New-NetFirewallRule @firewallParameters | Out-Null

          Set-Service -Name sshd -StartupType Automatic
          if ((Get-Service -Name sshd).Status -eq 'Running') {
            Restart-Service -Name sshd -Force
          } else {
            Start-Service -Name sshd
          }

          Start-Sleep -Seconds 2
          if ((Get-Service -Name sshd).Status -ne 'Running') {
            throw 'Windows OpenSSH service did not start.'
          }

          $listener = Get-NetTCPConnection -State Listen -LocalPort 2222 -ErrorAction SilentlyContinue
          if (-not $listener) {
            throw 'OpenSSH is running but no TCP listener was found on port 2222.'
          }

          "ssh_user=$sshUser" >> $env:GITHUB_OUTPUT
          Write-Host "Windows SSH user: $sshUser"
          Write-Host 'Windows OpenSSH is listening on TCP port 2222.'

      - name: Verify Windows Runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tsIp = (& tailscale ip -4 | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($tsIp)) {
            throw 'Tailscale did not assign an IPv4 address.'
          }

          $listener = Get-NetTCPConnection -State Listen -LocalPort 2222 -ErrorAction SilentlyContinue
          if (-not $listener) {
            throw 'SSH port 2222 is not listening.'
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'WINDOWS REMOTE RUNNER IS READY'
          Write-Host '========================================'
          Write-Host "Tailscale IP: $tsIp"
          Write-Host "SSH user:     ${{ steps.ssh.outputs.ssh_user }}"
          Write-Host 'SSH port:     2222'
          Write-Host 'Workspace:    C:\workspace'
          Write-Host ''
          Write-Host 'Connect from your Linux machine:'
          Write-Host "ssh -p 2222 ${{ steps.ssh.outputs.ssh_user }}@$tsIp"
          Write-Host '========================================'

      - name: Keep Windows Runner Online
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          while ($true) {
            $service = Get-Service -Name sshd
            if ($service.Status -ne 'Running') {
              Write-Host 'OpenSSH stopped; attempting to restart it...'
              Start-Service -Name sshd
              Start-Sleep -Seconds 2
            }

            Write-Host "[$(Get-Date -Format o)] Windows runner is online; SSH port 2222 is available."
            Start-Sleep -Seconds 300
          }
