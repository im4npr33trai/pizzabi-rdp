name: OpenCode Wrap Remote Runner + Tailscale + SSH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-wrap-remote-session
  cancel-in-progress: false

jobs:
  opencode-wrap-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: "tag:github-actions"
          version: latest

      - name: Verify Tailscale Connection
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"
          test -n "$TS_IP" || {
            echo "Tailscale did not assign an IPv4 address."
            exit 1
          }
          echo "Tailscale connection established: $TS_IP"

      - name: Start Minimal Ubuntu Container
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          docker rm -f opencode-wrap-remote 2>/dev/null || true

          # This workspace is intentionally ephemeral. It is not snapshotted,
          # uploaded, downloaded, or restored between workflow runs.
          mkdir -p "$RUNNER_TEMP/opencode-wrap-workspace"
          docker run -d \
            --name opencode-wrap-remote \
            --network host \
            --restart=no \
            --volume "$RUNNER_TEMP/opencode-wrap-workspace:/workspace" \
            ubuntu:24.04 sleep infinity

      - name: Install SSH, OpenCode CLI, Rust, and OpenCode Wrap
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PUBLIC_KEY//[[:space:]]/}" ]; then
            echo "Missing repository secret: SSH_PUBLIC_KEY"
            exit 1
          fi

          docker exec -i opencode-wrap-remote bash -s <<'CONTAINER_SETUP'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          log() { printf '\n[runner-setup] %s\n' "$*"; }

          log "Installing minimal system dependencies..."
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git openssh-server sudo build-essential pkg-config
          rm -rf /var/lib/apt/lists/*

          log "Creating remote user and SSH configuration..."
          id remote >/dev/null 2>&1 || useradd --create-home --shell /bin/bash remote
          usermod -aG sudo remote
          printf '%s\n' "remote ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/remote
          chmod 0440 /etc/sudoers.d/remote
          visudo -cf /etc/sudoers.d/remote

          mkdir -p /run/sshd /workspace /home/remote/.ssh \
            /home/remote/Downloads /home/remote/Projects \
            /home/remote/.local/bin /home/remote/.cargo/bin
          chown -R remote:remote /workspace /home/remote
          chmod 700 /home/remote/.ssh
          ssh-keygen -A

          cat > /etc/profile.d/remote-tools.sh <<'REMOTE_TOOLS_ENV'
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          export WRAP_PORT=8000
          export OPENCODE_PORT=4100
          export WRAP_CWD=/workspace
          REMOTE_TOOLS_ENV
          chmod 644 /etc/profile.d/remote-tools.sh

          cat > /etc/ssh/sshd_config <<'SSHD_CONFIG'
          Port 2222
          AddressFamily any
          ListenAddress 0.0.0.0
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          AllowUsers remote
          X11Forwarding no
          AllowTcpForwarding yes
          PermitTunnel no
          Subsystem sftp /usr/lib/openssh/sftp-server
          SSHD_CONFIG

          sshd -t
          log "Minimal SSH runtime is configured."
          CONTAINER_SETUP

          # Inject the public key outside the setup heredoc.
          printf '%s\n' "$SSH_PUBLIC_KEY" |
            docker exec -i opencode-wrap-remote bash -c 'cat > /home/remote/.ssh/authorized_keys && chown remote:remote /home/remote/.ssh/authorized_keys && chmod 600 /home/remote/.ssh/authorized_keys'

          docker exec -d opencode-wrap-remote /usr/sbin/sshd -D -e

          log() { printf '\n[runner-setup] %s\n' "$*"; }
          log "Installing OpenCode CLI v2, required by OpenCode Wrap..."
          docker exec opencode-wrap-remote su - remote -s /bin/bash -c '
            set -euo pipefail
            export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.opencode/bin:$PATH"

            if ! command -v opencode >/dev/null 2>&1; then
              curl -fsSL https://opencode.ai/v2/install | bash
            fi

            OPENCODE_VERSION="$(opencode --version)"
            echo "OpenCode version: $OPENCODE_VERSION"
            if ! printf "%s\n" "$OPENCODE_VERSION" | grep -Eq "(^|[^0-9])v?2\.[0-9]"; then
              echo "OpenCode Wrap requires OpenCode CLI v2.x."
              exit 1
            fi

            log() { printf "\n[runner-setup] %s\n" "$*"; }
            log "Installing Rust stable with rustup..."
            if ! command -v cargo >/dev/null 2>&1; then
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            fi

            source "$HOME/.cargo/env"
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo --version
            rustc --version

            log "Installing opencode-wrap from GitHub using Cargo..."
            cargo install --git https://github.com/Fast-Editor/OpenCode-Wrap.git opencode-wrap

            export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
            command -v opencode
            command -v cargo
            command -v opencode-wrap
            opencode-wrap --version
          '

      - name: Verify SSH and OpenCode Wrap
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"
          test -n "$TS_IP"

          for attempt in $(seq 1 30); do
            if timeout 3 bash -c "</dev/tcp/$TS_IP/2222" 2>/dev/null; then
              echo "SSH port 2222 is reachable."
              break
            fi
            echo "Waiting for SSH server ($attempt/30)..."
            sleep 3
          done

          if ! timeout 3 bash -c "</dev/tcp/$TS_IP/2222" 2>/dev/null; then
            echo "SSH port 2222 is not reachable."
            docker logs opencode-wrap-remote || true
            exit 1
          fi

          docker exec opencode-wrap-remote su - remote -s /bin/bash -c '
            export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
            opencode --version
            cargo --version
            opencode-wrap --version
          '

      - name: Keep OpenCode Wrap Runner Online
        run: |
          set -euo pipefail
          TS_IP="$(tailscale ip -4 | head -n 1)"

          echo
          echo "========================================"
          echo "OPENCODE WRAP REMOTE RUNNER IS READY"
          echo "========================================"
          echo "Tailscale IP: $TS_IP"
          echo "SSH:          ssh -p 2222 remote@$TS_IP"
          echo "Workspace:    /workspace (ephemeral)"
          echo
          echo "First connect and authenticate OpenCode:"
          echo "  ssh -t -p 2222 remote@$TS_IP"
          echo "  opencode auth login"
          echo
          echo "Then start the wrapper:"
          echo "  cd /workspace"
          echo "  opencode-wrap"
          echo
          echo "OpenCode Wrap listens on 127.0.0.1:8000."
          echo "From your local machine, open a second terminal and run:"
          echo "  ssh -N -L 8000:127.0.0.1:8000 -p 2222 remote@$TS_IP"
          echo "Local OpenAI-compatible API: http://127.0.0.1:8000/v1"
          echo "Default model: opencode/deepseek-v4.1-flash-free"
          echo "========================================"

          while true; do
            if [ "$(docker inspect -f '{{.State.Running}}' opencode-wrap-remote 2>/dev/null)" != "true" ]; then
              echo "OpenCode Wrap container stopped unexpectedly."
              docker logs opencode-wrap-remote || true
              exit 1
            fi

            echo "[$(date -Is)] OpenCode Wrap runner is available."
            sleep 300
          done

      - name: Cleanup OpenCode Wrap Container
        if: always()
        run: |
          docker rm -f opencode-wrap-remote 2>/dev/null || true
          echo "OpenCode Wrap container removed."
